<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载课件</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main>
    <header><div><h1>下载课件</h1><span id="subtitle">当前课程</span></div><button id="closePanel" class="icon-button" aria-label="关闭面板" title="关闭" hidden></button></header>
    <p id="demoBanner" class="hint" hidden>界面示例 · 虚构数据</p>
    <div id="sourceRow" class="source"><select id="sourceTab" aria-label="来源课程页面"></select><button id="refreshTabs" class="quiet" title="刷新页面列表">刷新</button></div>
    <div class="toolbar"><button id="scanCurrent">扫描当前页</button><button id="scanCatalog">按章节扫描</button><button id="stopScan" class="quiet" hidden>停止扫描</button></div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section id="catalog" hidden>
      <div class="section-title"><label><input id="allChapters" type="checkbox">全选章节</label><button id="closeCatalog" class="quiet">返回文件</button></div>
      <div id="chapterList" class="list"></div>
      <button id="startChapterScan" class="primary full">扫描所选章节</button>
    </section>
    <section id="library">
      <div class="filter"><input id="search" type="search" placeholder="搜索文件或章节" aria-label="搜索文件或章节"><select id="typeFilter" aria-label="文件类型"><option value="">全部类型</option><option value="document">文档</option><option value="slides">演示</option><option value="sheet">表格</option><option value="archive">压缩包</option><option value="image">图片</option><option value="media">音视频</option></select></div>
      <div class="section-title"><label><input id="selectAll" type="checkbox">全选</label><span id="fileCount"></span></div>
      <div id="resourceRows" class="list"></div>
      <div id="emptyLibrary" class="empty">没有识别到课件<br><small>课程首页可使用“按章节扫描”</small></div>
      <footer><span id="selectedCount">未选择文件</span><button id="copySelected" disabled>复制链接</button><button id="downloadSelected" class="primary" disabled>下载所选</button></footer>
    </section>
    <details id="queueDetails"><summary>下载记录 <span id="queueCount"></span></summary><div class="detail-body"><div class="toolbar"><button id="pauseQueue">暂停全部</button><button id="retryQueue">重试失败</button><button id="cancelQueue" class="quiet">取消全部</button><button id="clearFinished" class="quiet">清理记录</button></div><div id="queueRows" class="list compact"></div></div></details>
    <details id="settingsDetails"><summary>设置与帮助</summary><div class="detail-body settings">
      <label>文件版本<select id="format"><option value="original">保留原格式</option><option value="pdf">文档使用 PDF 版</option></select></label>
      <label>下载子目录<input id="folder" maxlength="40"></label>
      <div class="pair"><label>并行任务<select id="concurrency"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>自动重试<select id="retries"><option>0</option><option>1</option><option>2</option></select></label></div>
      <label class="check"><input id="organize" type="checkbox">按课程、章节归档</label><label class="check"><input id="saveAs" type="checkbox">每次询问保存位置</label>
      <button id="saveSettings">保存设置</button>
      <div class="help"><strong>IDM 接管导致异常？</strong><p>本扩展无法可靠阻止 IDM。可在 IDM「选项 → 文件类型」的不自动下载站点列表中添加 <code>*.cldisk.com</code> 和 <code>*.chaoxing.com</code>。使用 .com.cn 域名时也添加 <code>*.chaoxing.com.cn</code>。</p><a href="https://www.internetdownloadmanager.com/support/using_idm/options.html" target="_blank" rel="noreferrer">查看 IDM 官方设置说明</a></div>
      <div class="toolbar"><button id="scanTabs">扫描所有已开页面</button><button id="exportManifest" class="quiet">导出无链接清单</button><button id="clearLibrary" class="quiet">清空课件列表</button></div>
      <p class="hint">PDF 优先采用平台 PDF 链接；Office 默认下载原件。复制的链接可能过期，请勿公开。关闭面板后已提交的下载继续。</p>
    </div></details>
    <div id="copyFallbackBox" hidden><label for="copyFallback">浏览器未允许复制，请手动复制：</label><textarea id="copyFallback" readonly></textarea><button id="closeFallback" class="quiet">收起</button></div>
  </main>
  <script type="module" src="src/manager.js"></script>
</body>
</html>
